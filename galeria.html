<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería del Evento</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 15px; }
    .container { max-width: 900px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; position: sticky; top: 10px; z-index: 10; }
    .topbar h2 { margin: 0; font-size: 18px; }
    .btn-volver { background: #4285F4; color: white; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; }
    #estadoGaleria { text-align: center; color: #666; margin: 40px 0; font-size: 16px; }
    
    /* Cuadrícula responsiva: 3 columnas en móvil, 4 o 5 en pantallas grandes */
    .grid-galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    @media (min-width: 600px) {
      .grid-galeria { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    }
    .foto-item { position: relative; width: 100%; padding-top: 100%; overflow: hidden; border-radius: 8px; background: #e0e0e0; cursor: pointer; }
    .foto-item img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
    .foto-item img:hover { transform: scale(1.04); }

    /* Visor ampliado */
    .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; flex-direction: column; }
    .modal img { max-width: 94%; max-height: 82%; border-radius: 8px; }
    .modal-close { position: absolute; top: 18px; right: 24px; color: white; font-size: 34px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h2>🖼️ Álbum (<span id="totalFotos">0</span>)</h2>
      <a href="index.html" class="btn-volver">➕ Subir fotos</a>
    </div>

    <div id="estadoGaleria">Cargando todas las fotos del álbum... ⏳</div>
    <div class="grid-galeria" id="galeria"></div>
  </div>

  <div class="modal" id="visorModal" onclick="cerrarModal()">
    <span class="modal-close">&times;</span>
    <img id="imagenAmpliada" src="" alt="Foto ampliada">
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSjprB95VK-ywTb8fj1C9grSBJAL8L2amZ4GBZ5IigZduPtCMs-lBgivcYhLQBivlx/exec';

    window.addEventListener('DOMContentLoaded', cargarTodasLasFotos);

    async function cargarTodasLasFotos() {
      const galeria = document.getElementById('galeria');
      const estado = document.getElementById('estadoGaleria');
      const total = document.getElementById('totalFotos');

      try {
        const respuesta = await fetch(SCRIPT_URL);
        const datos = await respuesta.json();

        if (!datos.exito) throw new Error(datos.error);

        total.innerText = datos.fotos.length;

        if (datos.fotos.length === 0) {
          estado.innerText = 'Aún no hay fotos subidas. ¡Pulsa "+ Subir fotos" para empezar!';
          return;
        }

        estado.style.display = 'none';

        datos.fotos.forEach(foto => {
          const div = document.createElement('div');
          div.className = 'foto-item';
          div.onclick = () => abrirModal(foto.id);

          const img = document.createElement('img');
          img.src = foto.url;
          img.alt = foto.nombre;
          img.loading = 'lazy';

          div.appendChild(img);
          galeria.appendChild(div);
        });
      } catch (err) {
        estado.innerText = '❌ Error al cargar la galería: ' + err.message;
      }
    }

    function abrirModal(fileId) {
      const modal = document.getElementById('visorModal');
      const img = document.getElementById('imagenAmpliada');
      img.src = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1600`;
      modal.style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('visorModal').style.display = 'none';
    }
  </script>
</body>
</html>
